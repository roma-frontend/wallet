<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Maskable icons need a 60% safe zone (centered) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background -->
  <rect width="512" height="512" fill="url(#g)"/>
  <!-- Wallet/card in safe zone (centered, ~60% of canvas = 307px) -->
  <rect x="180" y="190" width="152" height="112" rx="22" fill="#ffffff" fill-opacity="0.95"/>
  <!-- Green dot -->
  <circle cx="296" cy="268" r="18" fill="#10b981"/>
</svg>
